<section class="dashboard" aria-labelledby="welcome-heading">
  <header class="welcome">
    <h1 id="welcome-heading">Welcome to iSpark</h1>
    <p>Your classroom at a glance.</p>
  </header>

  <section
    class="stats-grid"
    aria-label="Program overview"
    [attr.aria-busy]="loading"
  >
    @for (stat of stats; track stat.label) {
      <mat-card class="stat-card">
        <span class="stat-icon" [class]="'stat-icon ' + stat.color">
          <mat-icon fontSet="material-symbols-outlined">{{ stat.icon }}</mat-icon>
        </span>
        <div class="stat-copy">
          <strong>{{ stat.value }}</strong>
          <span>{{ stat.label }}</span>
        </div>
        <a
          class="stat-link"
          mat-icon-button
          [routerLink]="stat.route"
          [attr.aria-label]="'Go to ' + stat.label"
        >
          <mat-icon fontSet="material-symbols-outlined">arrow_forward</mat-icon>
        </a>
      </mat-card>
    }
  </section>

  @if (errorMessage) {
    <div class="dashboard-error" role="alert">
    <span>{{ errorMessage }}</span>
    <button type="button" (click)="loadStats()">Retry</button>
    </div>
  }

  <div class="action-area">
    <a class="attendance-card" routerLink="/attendance">
      <span class="attendance-card-icon">
        <mat-icon fontSet="material-symbols-outlined">fact_check</mat-icon>
      </span>
      <span class="attendance-card-copy">
        <strong>Take Attendance</strong>
        <span>Mark your trainees for today's class</span>
      </span>
      <mat-icon class="attendance-card-arrow" fontSet="material-symbols-outlined">
        arrow_forward
      </mat-icon>
    </a>
  </div>
</section>
