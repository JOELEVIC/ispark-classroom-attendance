
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ispark_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ispark_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ispark_attendance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./api/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    # Optional host access; use 5433 because your existing DB uses 5432.
    ports:
      - "127.0.0.1:5433:5432"

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ispark_dev_user}:${POSTGRES_PASSWORD:-ispark_dev_password}@db:5432/${POSTGRES_DB:-ispark_attendance}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
